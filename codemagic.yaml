workflows:
  ios-simulator:
    name: Tesis UCM - iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - &install-xcodegen
        name: Install XcodeGen
        script: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - &generate-project
        name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Build for iOS Simulator
        script: |
          xcodebuild \
            -project TesisUCM.xcodeproj \
            -scheme TesisUCM \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify JSON catalog in the iPhone app
        script: |
          app="build/DerivedData/Build/Products/Debug-iphonesimulator/TesisUCM.app"
          python3 scripts/verify_catalog.py "$app/Catalog/Resources"

    artifacts:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/TesisUCM.app
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: Tesis UCM - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic AJC Player

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: es.angelsoto.tesisucm

    scripts:
      - *install-xcodegen
      - *generate-project

      - name: Set build number and apply signing profiles
        script: |
          set -eu
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -eu
          xcode-project build-ipa --project TesisUCM.xcodeproj --scheme TesisUCM

      - name: Verify JSON catalog in signed IPA before upload
        script: |
          set -eu
          set -- build/ios/ipa/*.ipa
          test "$#" -eq 1
          test -f "$1"
          destination="$(mktemp -d)"
          trap 'rm -rf "$destination"' EXIT
          /usr/bin/ditto -x -k "$1" "$destination"
          python3 scripts/verify_catalog.py "$destination/Payload/TesisUCM.app/Catalog/Resources"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
