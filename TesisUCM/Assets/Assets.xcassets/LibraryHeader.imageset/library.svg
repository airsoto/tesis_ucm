<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9bc8ef"/><stop offset=".58" stop-color="#d9e9f4"/><stop offset="1" stop-color="#f8e7c9"/></linearGradient>
 <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7dc" stop-opacity=".9"/><stop offset="1" stop-color="#fff7dc" stop-opacity="0"/></linearGradient>
 <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4d9b5"/><stop offset="1" stop-color="#bd8060"/></linearGradient>
 <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a75e49"/><stop offset="1" stop-color="#663b36"/></linearGradient>
 <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#829b5c"/><stop offset="1" stop-color="#405e3c"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6e8ec"/><stop offset="1" stop-color="#668a9a"/></linearGradient>
</defs>
