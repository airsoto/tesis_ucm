name: TesisUCM

options:
  bundleIdPrefix: es.angelsoto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: es.angelsoto.tesisucm
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Tesis UCM"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TesisUCM:
    type: application
    platform: iOS
    sources:
      - path: TesisUCM/App
      - path: TesisUCM/Models
      - path: TesisUCM/Services
      - path: TesisUCM/Theme
      - path: TesisUCM/Views
    resources:
      - path: TesisUCM/Resources/catalog.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.angelsoto.tesisucm
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleDisplayName: "Tesis UCM"
