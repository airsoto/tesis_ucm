name: TesisUCM

options:
  bundleIdPrefix: es.angelsoto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: es.angelsoto.tesisucm
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Tesis UCM"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic

targets:
  TesisUCM:
    type: application
    platform: iOS
    sources:
      - path: TesisUCM/App
      - path: TesisUCM/Models
      - path: TesisUCM/Services
      - path: TesisUCM/Theme
      - path: TesisUCM/Views
      - path: TesisUCM/Assets
      - path: TesisUCM/Resources
        type: folder
        # Keep the source folder out of the iOS bundle root for code signing.
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Catalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.angelsoto.tesisucm
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Tesis UCM"
